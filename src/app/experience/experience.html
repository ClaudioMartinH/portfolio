<section
  id="experience"
  class="page-section experience-section"
>
  <div class="container">

    <h2 class="section-title">
      {{ 'experience.title' | translate }}
    </h2>

    <p class="section-subtitle">
      {{ 'experience.bio' | translate }}
    </p>

    <div class="experience-timeline">
      <article
        class="experience-item"
        *ngFor="let exp of experiences"
      >
        <span class="timeline-dot"></span>

        <div class="experience-content">
          <header class="experience-header">
            <div class="company">
              <img
                [src]="exp.logo"
                alt="{{ exp.company }}"
                class="company-logo"
              />

              <div class="company-text">
                <h4 class="company-name">
                  {{ exp.company | translate }}
                </h4>
                <p class="role">
                  {{ exp.position | translate }}
                </p>
              </div>
            </div>

            <div class="meta">
              <span class="date">
                {{ exp.date | translate }}
              </span>
              <span
                class="mode"
                [ngClass]="exp.modeClass"
              >
                {{ exp.mode | translate }}
              </span>
            </div>
          </header>

          <ul class="details">
            <li *ngFor="let d of exp.details">
              {{ d | translate }}
            </li>
          </ul>
        </div>
      </article>
    </div>

  </div>
</section>
