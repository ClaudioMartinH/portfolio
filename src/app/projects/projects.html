<section class="section projects-section" id="projects">
  <div class="container">

    <h2 class="section-title">
      {{ 'projects.title' | translate }}
    </h2>

    <p class="section-subtitle">
      {{ 'projects.bio' | translate }}
    </p>

    <div class="filters">
      <button
        *ngFor="let filter of ['all', 'web-dev', 'app-dev', 'cou-cer']"
        [class.active]="activeFilter === filter"
        (click)="filterProjects(filter)"
      >
        {{ ('projects.filters.' + filter) | translate }}
      </button>
    </div>

    <div class="projects-grid">
      <div *ngFor="let project of filteredProjects" class="project-card">
        
        <div class="project-image-container">
          <img
            [src]="project.image"
            [alt]="project.titleKey"
          />
        </div>

        <div class="project-info">
          <h3>
            {{ 'projects.titles.' + project.titleKey | translate }}
          </h3>

          <p>
            {{ 'projects.descriptions.' + project.descriptionKey | translate }}
          </p>

          <p class="project-extra">
            {{ 'projects.text.' + project.textKey | translate }}
          </p>

          <div class="project-links-inline">
            <a
              *ngIf="project.previewLink"
              [href]="project.previewLink"
              target="_blank"
            >
              Preview
            </a>

            <a
              *ngIf="project.detailsLink"
              [href]="project.detailsLink"
              target="_blank"
            >
              Details
            </a>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
